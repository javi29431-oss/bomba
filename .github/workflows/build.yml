name: Build Mod
on:
  workflow_dispatch:
  push:
    branches: ["**"]
env:
  CXXFLAGS: -DFMT_USE_CONSTEVAL=0
jobs:
  build:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
      - name: Upload mod file
        uses: actions/upload-artifact@v4
        with:
          name: tick-assist
          path: build/**/*.geode
          if-no-files-found: error
